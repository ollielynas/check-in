<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Safety Supervisor</title>
    <link rel="stylesheet" href="checkin.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel='stylesheet' type='text/css' media='screen' href='common.css'>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src='common.js'></script>
</head>
<body>
    <div class="header">
        <img class="logo" src="logo.png"></img>
        <div class="header-button">
            <button onclick="window.location='./login.html';" class="sign-in-button nav-button"><i class="ph ph-user-switch"></i></button>   
            <button onclick="window.location='./index.html';" class="nav-home nav-button"><i class="ph ph-house-line"></i></button>   
        </div>
    </div>
    <div class="container">
        <header>
            <!-- <h1>Night Safety Supervisor</h1> -->
        </header>
        <main>
            <div id="map" class="map"></div>
            <div class="friend-list">
                <h2>Friends' Check-Ins</h2>
                <h3>Last updated at <span id = "last-update"></span></h3>
                <ul id="friends">
                    <!-- Dynamically populated list of friends -->
                </ul>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="checkin.js"></script>
</body>
</html>
