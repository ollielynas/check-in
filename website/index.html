<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Check In</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src='common.js'></script>
</head>
<body in-session="false" onload="windowOnLoad()">


    <div class="header">
        <img class="logo" src="logo.png"></img>
        <div class="header-button">
            <button onclick="window.location='./login.html';" class="sign-in-button"><i class="ph ph-user-switch"></i></button>   
            <button onclick="window.location='./settings.html';" class="settings"><i class="ph ph-gear"></i></button>   
            <button onclick="window.location='./FriendsCheckin.html';" class="settings"><i class="ph ph-map-trifold"></i></button>   
        </div>
    </div>
    <div class="content">
        <div class="out-session-content">
        <button onclick="start_session_home();start_session()" class="big-button button-51">
            Start Session
        </button>
        <div class="h">
            <span>check in every</span>
        <span onkeypress="return /^\d+$/.test(String.fromCharCode(event.charCode));" contenteditable="true" value="20" type="number">20</span>
        <span>min</span>
        </div>
        <div class="h">
        <span>for the next:</span>
        <span onkeypress="return /^\d+$/.test(String.fromCharCode(event.charCode));" contenteditable="true" value="60" type="number">60</span>
        <span>min</span>
        </div>
    </div>
        <div class="in-session-content">
            <h1 id="timer">00:00:00</h1>
            <i>Since you last checked in</i> 
            <br>    
            <br>
            <br>
        <button id="checkin-button" class="confirm-ok button-9" onclick="checkIn()">
            check in
        </button>
        <button onclick="end_session_home();end_session()" class="confirm-ok cancel-button button-9">
            cancel
        </button>   
    </div>
    </div>
    </div>



</body>
</html>
