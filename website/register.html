<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <title>Register</title>
</head>
<body>
  <div class="wrapper">
    <!-- Add your logo image here -->
    <img src="logo.png" alt="Logo" class="logo">
    <form action="/website/register.html" method="post">
      <h1>Sign up!</h1>
      <div class="input-box">
        <input onkeypress="return event.charCode != 32" type="text" name="username" placeholder="Username" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input onkeypress="return event.charCode != 32" type="text" name="email" placeholder="Email Address" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input onkeypress="return event.charCode != 32" type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input onkeypress="return event.charCode != 32" type="password" name="confirm-password" placeholder="Confirm Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="remember-forgot">
        <label><input name="remember" type="checkbox">Remember Me</label>
      </div>

      <ul class=errors>
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>

      <button type="submit" class="btn">Register</button>
      <div class="register-link">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </form>
  </div>
</body>
</html>
